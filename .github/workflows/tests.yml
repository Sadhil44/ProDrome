name: tests

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately NOT `pip install -r requirements.txt`. That pulls torch
      # (~2 GB, CUDA wheels by default) for ml/cnn.py, which no test imports, and
      # the kubernetes client, which needs a cluster to be worth anything. The
      # suite reads data/samples/ and exercises the contracts; these are what it
      # actually needs. If a test ever needs more, add it here explicitly rather
      # than reaching for the full file.
      #
      # `rich` is the one addition, and it is here for a reason:
      # tests/test_integration.py now IMPORTS dashboard/terminal.py and calls
      # render() instead of parsing the file for a `COLUMNS = [...]` literal.
      # Parsing could only pin the list. Importing also proves (a) the dashboard
      # surfaces a missing decision-log column instead of rendering it as a blank
      # cell, and (b) DECISIONS_LOG is the same path the controller writes -- the
      # defect where the dashboard read control/decisions.csv while the
      # controller wrote data/decisions/log.csv, so it rendered "waiting for
      # decisions" forever and nothing failed. A source parse could not see that
      # at all, and as of 2026-10-06 it cannot even see the columns: the literal
      # is now `COLUMNS = DECISION_LOG_COLUMNS`, imported from the controller.
      # `rich` is a small pure-Python package (no cluster, no compiler, no wheels
      # of consequence), so the trade is a few seconds of install for checks that
      # actually run the code. It is NOT a licence to install the rest of
      # requirements.txt.
      - name: Install test dependencies
        run: pip install pandas pyarrow numpy scikit-learn pytest rich

      # One invocation, widened -- NOT a second job, and NOT by moving files.
      #
      # Why widened rather than moved: tests/CLAUDE.md gives `tests/` to the
      # testing seat and says every other seat's tests live next to their code.
      # control/test_safety_rails.py is cluster's file -- it deliberately re-pins
      # DECISION_LOG_COLUMNS itself "so this file does not depend on Aahan's
      # fixtures" -- and ml/test_explain.py is diagnosis's. Dragging them into
      # tests/ would move four files into a directory their owners do not own and
      # would not edit. CI is a consumer of those tests, not their owner, so the
      # invocation moves and the files stay put.
      #
      # Why one invocation rather than a second step: ml.classifier loads or
      # refits ml/classifier.pkl at import, which is most of the suite's runtime,
      # and classifier.pkl is gitignored so CI always refits. A second pytest
      # process would pay that cost twice for nothing.
      #
      # Why the files are named rather than `pytest tests control ml`: the
      # install list above is only honest if the import surface is bounded. A
      # directory glob would silently drag in the next file that imports torch or
      # the kubernetes client and break CI for a reason that has nothing to do
      # with the change that triggered it. Naming them makes adding a dependency
      # a deliberate act, as tests/CLAUDE.md asks.
      #
      # Adding a test file of your own: add its path here. If you forget,
      # tests/test_ci_enforcement.py fails and tells you -- that is what it is
      # for, so the list cannot rot into a silent gap.
      #
      # collect/test_twoarm.py and eval/test_recovery.py joined on 2026-10-12.
      # They were held out of the gate while collect/ and eval/ were mid-campaign
      # -- not because they failed, but because making a file that is being
      # rewritten under us a merge gate turns one seat's work-in-progress into
      # everyone's red build. The campaign landed, so the reason expired and the
      # KNOWN_UNENFORCED entries went with it. They add 84 tests and about 10s.
      # Their import surface is already covered by the install list above:
      # pandas, pytest and stdlib only. Neither reads data/ -- collect's fakes
      # are injected callables and eval's frames are built in-process -- which is
      # what makes them enforceable from a fresh clone at all, where data/twoarm/
      # and data/chaos/ do not exist. Verified by running this exact invocation
      # against a copy of the tree with data/samples/ as its only data.
      #
      # NOT added: ml/test_restart_suppression.py. It defines no test_ functions
      # (it is a main() script), so naming it here would collect zero tests and
      # report green while asserting nothing -- worse than the documented gap.
      # See KNOWN_UNENFORCED in tests/test_ci_enforcement.py.
      #
      # No pytest.ini / xfail_strict: control/test_policy_gates.py marks two
      # findings non-strict on purpose (the fix is a threshold value, which is a
      # project decision on crosstalk/decisions). Turning those strict here would
      # convert a recorded finding into a red build.
      #
      # Strictness is opted into per test instead. The guarantee, which holds
      # whatever the current count is: a finding in tests/ that is a plain defect
      # with no judgement call in it is recorded as
      # `@pytest.mark.xfail(strict=True)`, so an XPASS meaning "somebody fixed
      # it" goes red and the marker gets deleted rather than lingering as a lie.
      # That is how the findings tests/test_integration.py used to carry -- the
      # relative LOG_FILE and the placeholder NORMAL/1.0 prediction -- were
      # retired: both were fixed, both markers were deleted, and the file now
      # asserts the fixed behaviour directly instead. The global switch cannot
      # tell those apart from the deliberate non-strict ones above, which is why
      # it stays off.
      - name: Run the contract suite
        run: >
          python -m pytest -q
          tests
          control/test_safety_rails.py
          control/test_policy_gates.py
          ml/test_explain.py
          ml/test_scale_sensitivity.py
          ml/test_abstention.py
          collect/test_twoarm.py
          collect/test_poscontrol.py
          eval/test_recovery.py
          eval/test_sensitivity.py
